<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brief frontend regression checks</title>
<style>body{margin:20px;font:14px system-ui;color:#15302b;background:#f5f8f6}h1{font-size:22px}li{margin:8px 0}iframe{border:1px solid #cbd8d2;background:white;display:block}pre{white-space:pre-wrap}.pass{color:#08754e}.fail{color:#b02b35}</style>
<h1>Frontend regression checks</h1><p id="status" role="status">Running…</p><ol id="results"></ol><pre id="metrics"></pre><iframe title="Site under test"></iframe>
<script>
(async()=>{
 const cases=[
  ['journal desktop',1440,1100,''],['journal mobile',390,844,''],
  ['social desktop',1440,1100,'?channel=social'],['social narrow mobile',320,900,'?channel=social'],
  ['social dark',1440,1100,'?channel=social&dark=1'],
  ['social archive',1440,1000,'archive.html?channel=social'],
  ['historical missing social edition',390,900,'briefs/2026-10-18/?channel=social'],
  ['shared trend on mobile',390,1000,'briefs/2026-10-20/?channel=social&field=ai&from=2026-10-13&to=2026-10-17&topic=s-ai-execution-debug']
 ];
 const base=new URL('../',location.href),frame=document.querySelector('iframe');
 const pause=ms=>new Promise(r=>setTimeout(r,ms));
 const keys=()=>Object.keys(localStorage).filter(k=>k.startsWith('brief'));
 const saved=Object.fromEntries(keys().map(k=>[k,localStorage.getItem(k)]));
 let failed=0;const metrics=[];
 try{
  for(const [name,width,height,path] of cases){
   keys().forEach(k=>localStorage.removeItem(k));
   const row=document.createElement('li');row.textContent=name+' — running';document.querySelector('#results').append(row);
   frame.style.width=width+'px';frame.style.height=height+'px';
   try{
    await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('page load timed out')),20000);frame.onload=()=>{clearTimeout(timeout);resolve()};frame.src=new URL(path,base).href});
    const d=frame.contentDocument,w=frame.contentWindow;
    const script=d.createElement('script');script.src=new URL('tests/site-qa.js',base).href;d.body.append(script);
    for(let i=0;i<300&&!d.body.dataset.qa;i++)await pause(100);
    if(d.body.dataset.qa!=='pass')throw Error(d.body.dataset.qaError||'checks timed out');
    const surface=d.querySelector('.card,.panel'),glass=surface?w.getComputedStyle(surface):null;
    if(width<=720&&glass&&glass.backdropFilter!=='none')throw Error('mobile blur should be disabled');
    if(w.getComputedStyle(d.querySelector('.shell')).borderTopWidth!=='0px')throw Error('unexpected page frame');
    metrics.push({name,width:w.innerWidth,height:w.innerHeight,overflow:d.documentElement.scrollWidth>w.innerWidth,background:glass?.backgroundImage,blur:glass?.backdropFilter});
    row.className='pass';row.textContent=name+' — PASS';
   }catch(e){failed++;row.className='fail';row.textContent=name+' — FAIL: '+e.message}
  }
 }finally{
  frame.src='about:blank';keys().forEach(k=>localStorage.removeItem(k));Object.entries(saved).forEach(([k,v])=>localStorage.setItem(k,v));
 }
 document.querySelector('#metrics').textContent=JSON.stringify(metrics,null,2);
 document.querySelector('#status').textContent=failed?failed+' case(s) failed':cases.length+' cases passed';
 document.body.dataset.qa=failed?'fail':'pass';
})();
</script></html>
